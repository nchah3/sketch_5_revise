<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanksgiving Dinner</title>

    <!-- Load the p5.js library -->
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px 20px;
        background: #110f20;
        color: #f9edda;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      main {
        max-width: 800px;
        margin: auto;
      }

      .eyebrow {
        color: ##FFFF00;
        font-size: 12px;
        letter-spacing: 3px;
      }

      h1 {
        margin: 12px 0;
        font: normal 42px Georgia, serif;
      }

      .intro {
        margin: 0 0 24px;
        color: #c2b4d5;
        line-height: 1.6;
      }

      canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
        border: 1px solid #554365;
        border-radius: 16px;
      }

      .controls {
        color: #c2b4d5;
        font-size: 13px;
        margin: 18px 0 24px;
      }

      kbd {
        color: #f9edda;
        font: inherit;
        border: 1px solid #554365;
        padding: 3px 7px;
        border-radius: 4px;
      }

      details {
        text-align: left;
        font-size: 13px;
        color: #c2b4d5;
        line-height: 1.7;
      }

      summary {
        cursor: pointer;
        color: #e6ac68;
      }

      a {
        color: #e6ac68;
      }

      @media (max-width: 500px) {
        body {
          padding: 24px 12px;
        }

        h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>

  <body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>

    <main>
      <div class="eyebrow">A Perfect Thanksgiving Feast</div>

      <h1>Enjoy a Nice Turkey Dinner with Friends and Family</h1>

      <p class="intro">
        
      </p>

      <div id="sketch" data-aria-label="Thanksgiving dinner scene"></div>

    </main>

    <script>
      let platex = 200;
      let platey = 275;
      let steamY =  205;
      let flameBright = 150;
      let flameChange = 2;
      let starSize = 4;
      let starChange = 0.25;
      
      function setup() {
        createCanvas(400, 400);
      }
      
      function draw(){
        background(240, 215, 180);
        
        // Drawing a table to place food on.
        fill(120, 75, 45);
        rect(0, 220, 400, 180);
        
        // Next is to draw a plate on top of the table
        fill(255, 245, 225);
        ellipse(platex, platey, 240, 90);
        
        // Adding Turkey on the plate
        fill(101, 84, 61);
        ellipse(platex, 252, 150, 75);
        
        // Drawing two bone tips on the end of the turkey
        fill(245, 220, 180);
        ellipse(117, 284, 25, 14);
        ellipse(117, 220, 25, 14);
        
        // Drawing drumsticks over part of each bone.
        fill(140, 72, 35)
        ellipse(141, 281, 60, 34);
        ellipse(141, 220, 60, 34);
        
        // adding steam on top of warm turkey for yumminess
        fill(255, 245, 225);
        ellipse(platex, steamY, 65, 26);
        
        steamY -= 0.5;
        if (steamY < 135) {
          steamY = 205;
        }
        
        // Adding a nice flame candle to lighten the table
        // making the candle base
        fill(255, 0, 0);
        rect(350, 205, 20, 60);
        
        // making the flame dim and light up for dramatic effect
        fill(flameBright, flameBright - 65, 20);
        ellipse(360, 193, 14, 24);
        
        flameBright += flameChange;
        
        if (flameBright >= 250){
          flameChange = -2;
        }
        
        if (flameBright <= 150){
          flameChange = 2;
        }
        
        // drawing a wooden frame.
        fill(120, 75, 45);
        rect(75, 25, 250, 95);
        
        // drawing night sky inside the frame for a nice thanksgiving night.
        fill(20, 30, 65);
        rect(82, 32, 236, 81);
        
        // Dividing the window into two panes
        fill(120, 120, 120);
        rect(197, 32, 6, 81);
        
        // Drawing the stars
        fill(255, 240, 175);
        ellipse(112, 52, starSize, starSize);
        ellipse(172, 82, starSize, starSize);
        ellipse(240, 89, starSize, starSize);
        ellipse(277, 56, starSize, starSize);
        
        // Making the stars glow in the night sky
        starSize += starChange;
        
        if (starSize >= 12) {
          starChange = -0.25;
        }
        
        if (starSize <= 4) {
          starChange = 0.25;
        }
      }
    </script>
  </body>
</html>
